spring.application.name=Ejercicio5MyAPIGestor
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/dbgestor}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.dbcp2.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Salud (healthcheck de Railway) y metricas (Modulo 3)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=gestor-backend
management.metrics.distribution.percentiles-histogram.http.server.requests=true